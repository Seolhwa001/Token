name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          mkdir -p /tmp/token_flutter
          cp pubspec.yaml /tmp/token_flutter/pubspec.yaml
          cd /tmp/token_flutter
          flutter create --platforms=android --project-name token_app .
          cp -r android "$GITHUB_WORKSPACE/android"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOKEN-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
